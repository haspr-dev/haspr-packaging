name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ShellCheck, Ruby Syntax & ShellSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on packaging scripts
        run: |
          shellcheck -S error scripts/bin/*.sh scripts/lib/*.sh rpm/scripts/*.sh tests/fixtures/*.sh

      - name: Check Ruby syntax (Chef recipes & InSpec controls)
        run: |
          find tests -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Install ShellSpec and run script specs
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- -y
          export PATH="$HOME/.local/bin:$PATH"
          cd scripts && shellspec
